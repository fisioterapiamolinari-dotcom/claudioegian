<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stand-Up &amp; Improv – Gianmarco e Claudio, Roma</title>
<meta name="description" content="Serate di stand-up e improvvisazione a Roma con Gianmarco Molinari e Claudio Riolino.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Karla:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --palco: #1c0d0e;
    --ottone: #e0a83e;
    --testo: "Karla", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--palco);
    font-family: var(--testo);
  }
  /* La locandina riempie la pagina; sotto c'è solo il pulsante */
  .pagina {
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding: 2rem 1.25rem calc(2.5rem + env(safe-area-inset-bottom, 0px));
    background:
      linear-gradient(180deg, rgba(28, 13, 14, 0) 0%, rgba(28, 13, 14, 0) 60%, rgba(28, 13, 14, .8) 100%),
      url("copertina.jpg") center top / cover no-repeat;
  }
  .bottone {
    display: inline-block;
    max-width: 24rem;
    padding: 1rem 2rem;
    background: var(--ottone);
    color: var(--palco);
    font-weight: 700;
    font-size: 1.15rem;
    line-height: 1.3;
    text-align: center;
    text-decoration: none;
    border-radius: 999px;
    box-shadow: 0 8px 28px rgba(0, 0, 0, .5);
    transition: transform .15s ease, background .15s ease;
  }
  .bottone:hover { background: #f0be5c; transform: translateY(-2px); }
  .bottone:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
  @media (prefers-reduced-motion: reduce) {
    .bottone { transition: none; }
  }
</style>
</head>
<body>
  <main class="pagina">
    <a class="bottone" href="https://fisioterapiamolinari-dotcom.github.io/claudioegian/qrcode.html">Se ti piacciono le nostre serate, clicca qui</a>
  </main>
</body>
</html>
