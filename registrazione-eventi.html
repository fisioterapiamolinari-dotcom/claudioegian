<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Stand-Up &amp; Impro – Registrazione 15 Ottobre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Karla:wght@400;500;700&display=swap">
<style>
/* Stesso stile classico del sito: velluto rosso, ottone e crema */
:root {
  --bg:#1c0d0e; --surface:#3b0a0d; --field:#1c0d0e; --ink:#f6ecdf; --muted:#cdbba8; --line:#9a5a58;
  --accent:#e0a83e; --on-accent:#1c0d0e; --ring:#f0be5c; --err:#ff9c8f; --ok:#6fd3a6;
  --font-display:"Abril Fatface","Rockwell",Georgia,serif;
  --font-body:"Karla",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:400 17px/1.45 var(--font-body);
  padding:20px max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left)); }
body::before { content:""; position:fixed; inset:0; z-index:-1;
  background:radial-gradient(ellipse 60% 40% at 80% 0%,rgba(255,226,160,.18),transparent 70%),
             linear-gradient(180deg,#2a1012 0%,#1c0d0e 100%); }
.wrap { max-width:640px; margin:0 auto; }
.wordmark { font:400 1.4rem var(--font-display); color:var(--accent); padding:6px 0; }
h1 { margin:10px 0 6px; font:400 clamp(2.2rem,7vw,3.2rem)/1.05 var(--font-display); letter-spacing:-.01em; }
h1 span { color:var(--accent); }
.lede { margin:0 0 20px; color:var(--muted); }
.panel { background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:20px; margin-bottom:18px; }
h2 { margin:0 0 14px; font:400 1.6rem/1.1 var(--font-display); }
label.l, .l { display:block; font-weight:700; margin:0 0 6px; }
input[type=text] { width:100%; height:52px; padding:0 14px; font:500 1.05rem var(--font-body); color:var(--ink);
  background:var(--field); border:2px solid var(--line); border-radius:12px; }
input::placeholder { color:var(--muted); opacity:.8; }
input:focus-visible, button:focus-visible, a.btn:focus-visible { outline:3px solid var(--ring); outline-offset:2px; }
input[aria-invalid=true] { border-color:var(--err); }
.grid { display:grid; gap:12px; grid-template-columns:1fr 1fr; }
.grid .full { grid-column:1 / -1; }
@media (max-width:520px){ .grid { grid-template-columns:1fr; } }
.stepper { display:flex; align-items:center; gap:10px; }
.stepper button { width:52px; height:52px; border-radius:12px; border:2px solid var(--line); background:var(--field); color:var(--ink); font:700 1.5rem var(--font-body); cursor:pointer; }
.stepper output { min-width:44px; text-align:center; font:400 1.8rem var(--font-display); }
.ospiti { display:grid; gap:14px; margin-top:4px; }
.ospite { border:0; margin:0; padding:12px 0 0; min-width:0; border-top:1px dashed var(--line); }
.ospite legend { padding:0; font-weight:700; color:var(--accent); margin-bottom:8px; }
.hint { margin:0; font-size:.92rem; color:var(--muted); }
.btn { display:inline-flex; align-items:center; justify-content:center; min-height:52px; padding:0 24px; border:0; border-radius:999px; cursor:pointer;
  background:var(--accent); color:var(--on-accent); font:400 1.2rem var(--font-display); text-decoration:none; }
.btn:hover { background:#f0be5c; }
.btn.full { width:100%; min-height:60px; font-size:1.35rem; border-radius:14px; }
.btn.ghost { background:transparent; color:var(--ink); border:2px solid var(--line); font:700 .95rem var(--font-body); min-height:44px; padding:0 18px; }
.btn.ghost:hover { background:rgba(224,168,62,.15); border-color:var(--accent); }
.err { color:var(--err); font-weight:600; margin:10px 0 0; }
.err:empty { display:none; }
.ok { color:var(--ok); font-weight:700; margin:12px 0 0; }
.ok:empty { display:none; }

.stato { display:flex; gap:8px; align-items:center; color:var(--muted); font-size:.92rem; margin-bottom:14px; }
.dot { width:10px; height:10px; border-radius:50%; background:var(--ok); flex:none; }
.dot.warn { background:var(--accent); }
.dot.bad { background:var(--err); }

.conti { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.conto { background:var(--field); border:1px solid var(--line); border-radius:14px; padding:14px 12px; text-align:center; }
.conto b { display:block; font:400 2.6rem/1.1 var(--font-display); color:var(--accent); }
.conto span { font-size:.95rem; color:var(--muted); }
.azioni { display:flex; flex-wrap:wrap; gap:10px; margin-top:16px; }
@media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="wordmark">Stand-Up &amp; Impro</div>
  <h1>Registrazione <span>15 Ottobre</span></h1>
  <p class="lede">Scrivi chi arriva e quanti biglietti si porta dietro. Finisce tutto direttamente sul tuo Google Fogli.</p>

  <div class="stato"><span class="dot warn" id="dot"></span><span id="statoTxt">Collegamento al foglio…</span></div>

  <section class="panel" aria-labelledby="t-nuova">
    <h2 id="t-nuova">Nuova registrazione</h2>
    <form id="f" novalidate>
      <div class="grid">
        <div>
          <label class="l" for="nome">Nome</label>
          <input id="nome" type="text" maxlength="60" autocomplete="off" autocapitalize="words">
        </div>
        <div>
          <label class="l" for="cognome">Cognome</label>
          <input id="cognome" type="text" maxlength="60" autocomplete="off" autocapitalize="words">
        </div>
        <div class="full">
          <span class="l" id="l-bigl">Quanti biglietti</span>
          <div class="stepper" role="group" aria-labelledby="l-bigl">
            <button type="button" id="meno" aria-label="Un biglietto in meno">−</button>
            <output id="bigl" aria-live="polite">1</output>
            <button type="button" id="piu" aria-label="Un biglietto in più">+</button>
          </div>
        </div>
      </div>
      <div class="ospiti" id="ospiti"></div>
      <p class="err" id="errore" role="alert"></p>
      <div style="margin-top:16px"><button class="btn full" type="submit" id="invia">Registra</button></div>
      <p class="ok" id="ok" role="status"></p>
    </form>
  </section>

  <section class="panel" aria-labelledby="t-conti">
    <h2 id="t-conti">Fin qui</h2>
    <div class="conti">
      <div class="conto"><b id="cReg">0</b><span>registrati</span></div>
      <div class="conto"><b id="cBigl">0</b><span>biglietti</span></div>
    </div>
    <div class="azioni">
      <button class="btn ghost" type="button" id="aggiorna">Aggiorna</button>
      <a class="btn ghost" id="apriFogli" target="_blank" rel="noopener">Apri Google Fogli</a>
    </div>
  </section>
</div>

<script>
(function () {
  "use strict";

  /* ============ DA COMPLETARE ============ */
  var CONFIG = {
    // URL dell'app web di Google Apps Script (finisce con /exec)
    scriptUrl: "https://script.google.com/macros/s/AKfycbyswiTV6hwUNNQVuRCZbETawarVUn0UwrBLkAbj3NUclyLkYSfzn0j1VFyMBovDsdAy/exec",
    // Stessa parola messa in CHIAVE dentro lo script
    chiave: "CAMBIA-QUESTA-CHIAVE",
    // L'evento di questa pagina
    evento: "15 Ottobre",
    // Il tuo foglio
    fogliUrl: "https://docs.google.com/spreadsheets/d/1v0zSIia5EeMW3fxB3Xo3KQdi2qrifOtkNT-VHy_vH4I/edit?gid=0#gid=0"
  };
  /* ======================================= */

  var $ = function (id) { return document.getElementById(id); };
  var rows = [], busy = 0, chain = Promise.resolve(), biglietti = 1, ospiti = [];
  var MAX = 20;

  $("apriFogli").href = CONFIG.fogliUrl;

  function stato(tipo, txt) {
    $("dot").className = "dot" + (tipo ? " " + tipo : "");
    $("statoTxt").textContent = txt;
  }
  function el(tag, cls, txt) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (txt != null) e.textContent = txt;
    return e;
  }
  function newId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  /* ---------- contatori ---------- */
  function conta() {
    var reg = 0, bigl = 0;
    rows.forEach(function (r) { if (r.evento === CONFIG.evento) { reg++; bigl += r.biglietti; } });
    $("cReg").textContent = reg; $("cBigl").textContent = bigl;
  }

  /* ---------- rete ---------- */
  function load() {
    if (!CONFIG.scriptUrl) { stato("warn", "Non ancora collegato: incolla l'URL dello script in scriptUrl."); return Promise.resolve(); }
    if (busy) return Promise.resolve();
    return fetch(CONFIG.scriptUrl + "?key=" + encodeURIComponent(CONFIG.chiave) + "&t=" + Date.now())
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j.ok) throw new Error(j.error === "chiave" ? "La chiave non coincide con quella dello script." : "Risposta non valida.");
        rows = j.rows; conta();
        stato("", "Collegato a Google Fogli · " + new Date().toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" }));
      })
      .catch(function (e) { stato("bad", "Non riesco a leggere il foglio: " + e.message); });
  }
  function send(p) {
    if (!CONFIG.scriptUrl) { stato("warn", "Non salvato sul foglio: manca scriptUrl."); return; }
    busy++;
    p.key = CONFIG.chiave;
    chain = chain.then(function () {
      var body = new URLSearchParams();
      Object.keys(p).forEach(function (k) { body.append(k, p[k]); });
      return fetch(CONFIG.scriptUrl, { method: "POST", mode: "no-cors", body: body });
    }).catch(function () { stato("bad", "Invio al foglio non riuscito. Controlla la connessione e premi Aggiorna."); })
      .then(function () { busy--; if (!busy) setTimeout(load, 900); });
  }

  /* ---------- ospiti (uno in più per ogni biglietto oltre il primo) ---------- */
  function disegnaOspiti() {
    var box = $("ospiti"); box.textContent = "";
    ospiti.length = Math.max(biglietti - 1, 0);
    for (var i = 0; i < biglietti - 1; i++) {
      (function (i) {
        if (!ospiti[i]) ospiti[i] = { nome: "", cognome: "" };
        var fs = el("fieldset", "ospite");
        fs.appendChild(el("legend", "", "Biglietto " + (i + 2)));
        var g = el("div", "grid");
        [["nome", "Nome"], ["cognome", "Cognome"]].forEach(function (c) {
          var w = el("div");
          var lab = el("label", "l", c[1]); var id = "o" + i + c[0]; lab.htmlFor = id;
          var inp = el("input"); inp.type = "text"; inp.id = id; inp.maxLength = 60; inp.autocomplete = "off";
          inp.setAttribute("autocapitalize", "words"); inp.value = ospiti[i][c[0]];
          inp.addEventListener("input", function () { ospiti[i][c[0]] = inp.value; });
          w.appendChild(lab); w.appendChild(inp); g.appendChild(w);
        });
        fs.appendChild(g); box.appendChild(fs);
      })(i);
    }
    if (biglietti > 1) box.appendChild(el("p", "hint", "Gli altri nomi sono facoltativi: se non li sai, lasciali vuoti."));
  }
  function setBigl(n) { biglietti = Math.min(MAX, Math.max(1, n)); $("bigl").textContent = biglietti; disegnaOspiti(); }
  $("meno").addEventListener("click", function () { setBigl(biglietti - 1); });
  $("piu").addEventListener("click", function () { setBigl(biglietti + 1); });

  /* ---------- registrazione ---------- */
  ["nome", "cognome"].forEach(function (id) {
    $(id).addEventListener("input", function () { $(id).removeAttribute("aria-invalid"); $("errore").textContent = ""; });
  });
  $("f").addEventListener("submit", function (e) {
    e.preventDefault();
    var nome = $("nome").value.trim(), cognome = $("cognome").value.trim();
    $("ok").textContent = "";
    if (!nome || !cognome) {
      if (!nome) $("nome").setAttribute("aria-invalid", "true");
      if (!cognome) $("cognome").setAttribute("aria-invalid", "true");
      $("errore").textContent = "Servono nome e cognome. Anche «Mario Rossi» va bene.";
      (!nome ? $("nome") : $("cognome")).focus();
      return;
    }
    $("errore").textContent = "";
    var altri = ospiti.map(function (o) { return (o.nome.trim() + " " + o.cognome.trim()).trim(); })
      .filter(function (s) { return s; }).join("; ");
    rows.push({ evento: CONFIG.evento, biglietti: biglietti }); conta();
    send({ action: "add", id: newId(), evento: CONFIG.evento, nome: nome, cognome: cognome,
           biglietti: String(biglietti), ospiti: altri });
    $("ok").textContent = "Registrato: " + nome + " " + cognome + " (" + biglietti + (biglietti === 1 ? " biglietto)" : " biglietti)");
    $("nome").value = ""; $("cognome").value = ""; ospiti = []; setBigl(1); $("nome").focus();
  });

  $("aggiorna").addEventListener("click", load);
  window.addEventListener("focus", load);

  disegnaOspiti(); conta(); load();
})();
</script>
</body>
</html>
